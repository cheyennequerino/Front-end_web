<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350" width="100%" height="100%">
  <!-- Definições de Sombras e Efeitos -->
  <defs>
    <linearGradient id="boloFundo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5C4033" />
      <stop offset="100%" stop-color="#3D2817" />
    </linearGradient>
    <linearGradient id="massaCamada" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B" />
      <stop offset="100%" stop-color="#654321" />
    </linearGradient>
    <linearGradient id="cremeTopo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7CCC8" />
      <stop offset="100%" stop-color="#BCAAA4" />
    </linearGradient>
    <linearGradient id="lacoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A1887F" />
      <stop offset="100%" stop-color="#4E342E" />
    </linearGradient>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Prato do Bolo -->
  <ellipse cx="150" cy="310" rx="110" ry="15" fill="#D7CCC8" filter="url(#sombra)" />
  <ellipse cx="150" cy="307" rx="100" ry="11" fill="#EFEBE9" />

  <!-- Base do Bolo (Camada Inferior) -->
  <path d="M 70 210 L 80 290 Q 150 305 220 290 L 230 210 Z" fill="url(#boloFundo)" filter="url(#sombra)" />
  
  <!-- Recheio / Detalhe Central -->
  <path d="M 75 250 Q 150 265 225 250" stroke="#BCAAA4" stroke-width="6" fill="none" opacity="0.3"/>

  <!-- Camada Superior do Bolo -->
  <path d="M 90 140 L 98 210 Q 150 220 202 210 L 210 140 Z" fill="url(#massaCamada)" filter="url(#sombra)" />

  <!-- Cobertura Escorrida (Ganache de Chocolate) -->
  <path d="M 90 140 Q 95 160 100 155 Q 115 185 125 155 Q 140 190 155 160 Q 170 185 185 155 Q 195 175 205 150 L 210 140 Q 150 120 90 140 Z" fill="#4E342E" filter="url(#sombra)" />

  <!-- Lacinho de Enfeite -->
  <g id="laco" transform="translate(150, 185) scale(0.9)" filter="url(#sombra)">
    <!-- Pontas do Laço -->
    <path d="M -5 10 L -20 30 L -5 20 Z" fill="#3E2723" />
    <path d="M 5 10 L 20 30 L 5 20 Z" fill="#3E2723" />
    <!-- Laço Esquerdo -->
    <path d="M 0 5 Q -25 -10 -25 -20 Q -25 -30 -5 -10 Z" fill="url(#lacoGrad)" />
    <!-- Laço Direito -->
    <path d="M 0 5 Q 25 -10 25 -20 Q 25 -30 5 -10 Z" fill="url(#lacoGrad)" />
    <!-- Nó Central -->
    <circle cx="0" cy="2" r="5" fill="#3E2723" />
  </g>

  <!-- Vela de Aniversário -->
  <g id="vela">
    <!-- Corpo da Vela (Listras Marrons e Creme) -->
    <rect x="142" y="60" width="16" height="65" rx="3" fill="#EFEBE9" filter="url(#sombra)" />
    <path d="M 142 75 L 158 85 L 158 95 L 142 85 Z" fill="#654321" />
    <path d="M 142 105 L 158 115 L 158 125 L 142 115 Z" fill="#654321" />

    <!-- Pavio -->
    <line x1="150" y1="60" x2="150" y2="50" stroke="#3E2723" stroke-width="2.5" stroke-linecap="round" />

    <!-- Chama da Vela -->
    <path d="M 150 48 Q 140 35 150 20 Q 160 35 150 48 Z" fill="#FFB300" filter="url(#sombra)" />
    <path d="M 150 44 Q 144 35 150 25 Q 156 35 150 44 Z" fill="#FFEE58" />
  </g>

  <!-- Cereja no Topo -->
  <g id="cereja" transform="translate(105, 120)" filter="url(#sombra)">
    <!-- Cabinho da Cereja -->
    <path d="M 0 -15 Q 15 -35 30 -10" fill="none" stroke="#558B2F" stroke-width="3" stroke-linecap="round" />
    <!-- Fruta (Cereja em tom marrom avermelhado escuro) -->
    <circle cx="0" cy="0" r="12" fill="#5D1A0C" />
    <!-- Brilho da Cereja -->
    <circle cx="-3" cy="-3" r="3.5" fill="#FF8A80" opacity="0.6" />
  </g>
</svg>